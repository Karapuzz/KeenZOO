user=nobody
# KeenZOO обновляет client interfaces, listen-address и local domain
# атомарно при каждом DNS refresh. WAN-интерфейсы в этот блок не попадают.
# BEGIN KeenZOO dynamic client interfaces
# END KeenZOO dynamic client interfaces
# BEGIN KeenZOO dynamic listen addresses
listen-address=127.0.0.1
# END KeenZOO dynamic listen addresses
# BEGIN KeenZOO dynamic local domain
domain=local,192.168.1.0/24
# END KeenZOO dynamic local domain

min-port=4096       # Specify lowest port available for DNS query transmission
cache-size=1536     # Specify the size of the cache in entries

# bind-dynamic обязателен: позволяет слушать интерфейсы, которые
# появляются позже (VPN-туннели), и не падать, если их ещё нет.
bind-dynamic

bogus-priv          # Fake reverse lookups for RFC1918 private address ranges
no-negcache         # Do NOT cache failed search results
no-resolv           # Do NOT read resolv.conf
no-poll             # Do NOT poll resolv.conf file, reload only on SIGHUP
clear-on-reload     # Clear DNS cache when reloading dnsmasq
expand-hosts        # Expand simple names in /etc/hosts with domain-suffix
localise-queries    # Return answers to DNS queries from /etc/hosts and --interface-name and --dynamic-host which depend on the interface over which the query was received
domain-needed       # Tells dnsmasq to never forward A or AAAA queries for plain names, without dots or domain parts, to upstream nameservers
log-async           # Enable async. logging; optionally set queue length
stop-dns-rebind     # Reject (and log) addresses from upstream nameservers which are in the private ranges
rebind-localhost-ok # Exempt the IPv4 loopback range from rebinding checks
#rebind-domain-ok=/lan/onion/i2p/
rebind-domain-ok=/lan/local/onion/lib/i2p/emc/coin/bazar/geek/libre/bbs/chan/cyb/indy/neo/null/pirate/

# DNS over TLS-HTTPS /tmp/ndnproxymain.stat
# KeenZOO обновляет этот блок после health-check: только проверенные
# upstream выбранного режима, в порядке ранжирования. Сменой режима
# local/tunnel/emergency управляет DNS v4 controller (utils.py), не порядок строк.
# BEGIN KeenZOO managed DNS upstreams
strict-order
server=127.0.0.1#40512
# END KeenZOO managed DNS upstreams
# Старые варианты оставлены только как комментарии.
#server=127.0.0.1#40501
#server=127.0.0.1#40509

# Tor onion
#ipset=/onion/unblock4-tor,unblock6-tor
server=/onion/127.0.0.1#9053
server=/onion/::1#9053
ipset=/onion/unblocktor

# I2P
address=/i2p/80.152.203.134
address=/i2p/2003:a:64b:3b00::4

