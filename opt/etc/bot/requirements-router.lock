# KeenZOO: закреплённые версии зависимостей панели/бота для роутера.
#
# Управляется релизом (раунд 21, М-08): версии меняются только вместе с
# выпуском проекта и только после прогона регресс-сьюта на поддерживаемых
# Python/архитектурах. Файл читается deploy_bypass.sh при установке
# зависимостей; при недоступности файла используются встроенные в скрипт
# версии-фолбэки (они держатся равными этим).
#
# Закрепление БЕЗ хэшей сознательно: для --require-hashes потребовались бы
# хэши каждой сборки колеса под КАЖДУЮ архитектуру роутера (arm/arm64/mips/
# mipsel/x86), что недостижимо без парка устройств. Контроль целостности
# остаётся за контрольной суммой архива проекта (см. INSTALL_HYBRID.txt).
#
# --no-deps для pyTelegramBotAPI обязателен: свежие выпуски тянут aiohttp,
# у которого нет готовых колёс для mips, а компилятора в Entware нет;
# aiohttp нужен только для AsyncTeleBot, проект использует обычный polling.
flask==3.1.3
pyTelegramBotAPI==4.37.0
